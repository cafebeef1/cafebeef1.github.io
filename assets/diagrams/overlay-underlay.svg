<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="525" viewBox="0 0 1000 525" role="img" aria-labelledby="title desc"><title id="title">Overlay 与 Underlay 网络架构</title><desc id="desc">两台虚拟机分别运行在 Host-A 和 Host-B 上，通过 VTEP 封装与物理 ToR、Spine 网络通信</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#71839a"/></marker></defs><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Noto Sans CJK SC","Microsoft YaHei",sans-serif}.heading{font-size:18px;font-weight:700}.label{font-size:15px;font-weight:650;fill:#21344d}.sub{font-size:13px;fill:#58708c}.small{font-size:12px;fill:#5c7189}</style><rect width="1000" height="525" rx="18" fill="#fff"/><rect x="25" y="20" width="950" height="182" rx="15" fill="#edf6ff" stroke="#c6dff7"/><text x="50" y="52" class="heading" fill="#275a91">OVERLAY <tspan font-size="14" font-weight="500">· 租户逻辑网络</tspan></text><rect x="25" y="225" width="950" height="265" rx="15" fill="#f5f7fb" stroke="#d5dbe6"/><text x="50" y="259" class="heading" fill="#526277">UNDERLAY <tspan font-size="14" font-weight="500">· 物理承载网络</tspan></text><rect x="88" y="90" width="250" height="68" rx="12" fill="#fff" stroke="#3b82f6" stroke-width="2"/><rect x="662" y="90" width="250" height="68" rx="12" fill="#fff" stroke="#3b82f6" stroke-width="2"/><text x="213" y="119" text-anchor="middle" class="label">VM-A</text><text x="213" y="141" text-anchor="middle" class="sub">10.0.1.10</text><text x="787" y="119" text-anchor="middle" class="label">VM-B</text><text x="787" y="141" text-anchor="middle" class="sub">10.0.1.20</text><path d="M338 124 H662" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="8 6"/><rect x="420" y="105" width="160" height="27" rx="13" fill="#edf6ff"/><text x="500" y="123" text-anchor="middle" class="small">逻辑二层通信</text><path d="M213 158 V307 M787 158 V307" fill="none" stroke="#38a47a" stroke-width="2.5" stroke-dasharray="6 6"/><rect x="186" y="207" width="54" height="22" rx="9" fill="#fff"/><text x="213" y="222" text-anchor="middle" class="small">运行于</text><rect x="760" y="207" width="54" height="22" rx="9" fill="#fff"/><text x="787" y="222" text-anchor="middle" class="small">运行于</text><rect x="83" y="307" width="260" height="92" rx="12" fill="#e4f5ee" stroke="#38a47a" stroke-width="2"/><rect x="657" y="307" width="260" height="92" rx="12" fill="#e4f5ee" stroke="#38a47a" stroke-width="2"/><text x="213" y="342" text-anchor="middle" class="label">Host-A / VTEP-A</text><text x="213" y="368" text-anchor="middle" class="sub">192.168.1.10</text><text x="787" y="342" text-anchor="middle" class="label">Host-B / VTEP-B</text><text x="787" y="368" text-anchor="middle" class="sub">192.168.1.20</text><g fill="#fff" stroke="#889bb2" stroke-width="1.5"><rect x="371" y="322" width="82" height="62" rx="10"/><rect x="459" y="322" width="82" height="62" rx="10"/><rect x="547" y="322" width="82" height="62" rx="10"/></g><text x="412" y="359" text-anchor="middle" class="label">ToR-A</text><text x="500" y="359" text-anchor="middle" class="label">Spine</text><text x="588" y="359" text-anchor="middle" class="label">ToR-B</text><path d="M343 353 H371 M453 353 H459 M541 353 H547 M629 353 H657" fill="none" stroke="#71839a" stroke-width="2.5"/><text x="500" y="448" text-anchor="middle" class="small">物理交换机仅根据外层宿主机 IP 转发；租户报文由 VTEP 封装和解封装</text></svg>