<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="525" viewBox="0 0 1020 525" role="img" aria-labelledby="title desc"><title id="title">云网络控制平面与数据平面的分离</title><desc id="desc">控制平面从云 API 收集配置，经过控制器编译转发规则并下发；数据平面中 VM 经 TAP、虚拟交换机及物理网卡发送报文</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#5993d5"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#37a48b"/></marker><marker id="purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#7b6ed9"/></marker></defs><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Noto Sans CJK SC","Microsoft YaHei",sans-serif}.heading{font-size:18px;font-weight:700}.label{font-size:16px;font-weight:650;fill:#21344d}.detail{font-size:13px;fill:#60718a}.tip{font-size:13px;fill:#6e62bb;font-weight:600}</style><rect width="1020" height="525" rx="15" fill="#fff"/><rect x="30" y="20" width="960" height="205" rx="14" fill="#eef5ff" stroke="#c9def6"/><text x="55" y="57" class="heading" fill="#27588a">CONTROL PLANE <tspan font-size="14" font-weight="500">· 控制平面（非逐包处理）</tspan></text><rect x="30" y="250" width="960" height="245" rx="14" fill="#eef9f6" stroke="#c7e7df"/><text x="55" y="286" class="heading" fill="#22775e">DATA PLANE <tspan font-size="14" font-weight="500">· 数据平面（逐包转发）</tspan></text><rect x="80" y="100" width="185" height="77" rx="11" fill="#fff" stroke="#5993d5" stroke-width="1.8"/><text x="172.5" y="133" class="label" text-anchor="middle">云 API / 网络资源</text><text x="172.5" y="156" class="detail" text-anchor="middle">VPC · Subnet · ACL</text><rect x="305" y="100" width="185" height="77" rx="11" fill="#fff" stroke="#5993d5" stroke-width="1.8"/><text x="397.5" y="133" class="label" text-anchor="middle">配置与状态</text><text x="397.5" y="156" class="detail" text-anchor="middle">网络对象 · 端点位置</text><rect x="530" y="100" width="185" height="77" rx="11" fill="#fff" stroke="#5993d5" stroke-width="1.8"/><text x="622.5" y="133" class="label" text-anchor="middle">控制器</text><text x="622.5" y="156" class="detail" text-anchor="middle">路由计算 · 策略编译</text><rect x="755" y="100" width="185" height="77" rx="11" fill="#fff" stroke="#5993d5" stroke-width="1.8"/><text x="847.5" y="133" class="label" text-anchor="middle">规则与映射</text><text x="847.5" y="156" class="detail" text-anchor="middle">Flow · FDB · ACL</text><rect x="80" y="345" width="185" height="83" rx="11" fill="#fff" stroke="#37a48b" stroke-width="1.8"/><text x="172.5" y="378" class="label" text-anchor="middle">VM / vNIC</text><text x="172.5" y="401" class="detail" text-anchor="middle">生成租户报文</text><rect x="305" y="345" width="185" height="83" rx="11" fill="#fff" stroke="#37a48b" stroke-width="1.8"/><text x="397.5" y="378" class="label" text-anchor="middle">TAP / vhost</text><text x="397.5" y="401" class="detail" text-anchor="middle">虚拟机 I/O 通道</text><rect x="530" y="345" width="185" height="83" rx="11" fill="#fff" stroke="#37a48b" stroke-width="1.8"/><text x="622.5" y="378" class="label" text-anchor="middle">虚拟交换机 / 内核</text><text x="622.5" y="401" class="detail" text-anchor="middle">查表 · ACL · 封装</text><rect x="755" y="345" width="185" height="83" rx="11" fill="#fff" stroke="#37a48b" stroke-width="1.8"/><text x="847.5" y="378" class="label" text-anchor="middle">物理网卡 / VTEP</text><text x="847.5" y="401" class="detail" text-anchor="middle">发送至 Underlay</text><path d="M265 139 H305" fill="none" stroke="#5993d5" stroke-width="2.5" marker-end="url(#blue)"/><path d="M490 139 H530" fill="none" stroke="#5993d5" stroke-width="2.5" marker-end="url(#blue)"/><path d="M715 139 H755" fill="none" stroke="#5993d5" stroke-width="2.5" marker-end="url(#blue)"/><path d="M265 386 H305" fill="none" stroke="#37a48b" stroke-width="2.5" marker-end="url(#green)"/><path d="M490 386 H530" fill="none" stroke="#37a48b" stroke-width="2.5" marker-end="url(#green)"/><path d="M715 386 H755" fill="none" stroke="#37a48b" stroke-width="2.5" marker-end="url(#green)"/><path d="M848 177 V237 H622 V345" fill="none" stroke="#7b6ed9" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#purple)"/><rect x="688" y="225" width="115" height="24" rx="10" fill="#fff"/><text x="745" y="242" text-anchor="middle" class="tip">规则下发 / 更新</text><text x="510" y="474" text-anchor="middle" class="detail">转发路径不必每包访问控制器；规则变更由控制平面异步下发</text></svg>